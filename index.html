<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | JavaScript Logic &amp; State Management To-Do App</title>
    <meta name="description" content="Interactive client-side To-Do List application built with vanilla JavaScript DOM manipulation, delegated event listeners, and window.localStorage persistence.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-gradient: radial-gradient(circle at top right, #1e293b 0%, #090d16 58%, #05070c 100%);
            --surface-card: rgba(17, 24, 39, 0.84);
            --surface-item: rgba(15, 23, 42, 0.78);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-btn: #0284c7;
            --accent-btn-hover: #0369a1;
            --success: #10b981;
            --warning: #fbbf24;
            --danger: #ef4444;
            --border-subtle: rgba(148, 163, 184, 0.22);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        :focus-visible {
            outline: 3px solid var(--warning);
            outline-offset: 2px;
        }

        .app-shell {
            max-width: 780px;
            margin: 0 auto;
        }

        .app-header {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 22px;
            padding: 1.85rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.45);
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            color: var(--warning);
            background: rgba(251, 191, 36, 0.14);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 0.28rem 0.78rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.94rem;
        }

        /* Stats Strip */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            text-align: center;
        }

        .stat-box strong {
            display: block;
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-box span {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* Create Task Form */
        .panel {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        }

        .task-form {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0.75rem;
        }

        input[type="text"],
        select {
            background: #0f172a;
            border: 1.5px solid #334155;
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--accent);
        }

        .btn-add {
            background: var(--accent-btn);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.4rem;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.18s ease;
        }

        .btn-add:hover {
            background: var(--accent-btn-hover);
        }

        /* Filter & Search Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.85rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .filter-group {
            display: flex;
            gap: 0.45rem;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            padding: 0.48rem 0.95rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .filter-btn.active {
            background: var(--accent-btn);
            color: #ffffff;
            border-color: var(--accent);
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.32);
            padding: 0.48rem 0.9rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* Task List */
        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item {
            background: var(--surface-item);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 0.95rem 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.85rem;
            transition: border-color 0.18s ease, opacity 0.18s ease;
        }

        .task-item:hover {
            border-color: rgba(56, 189, 248, 0.45);
        }

        .task-item.completed {
            opacity: 0.68;
            background: rgba(15, 23, 42, 0.45);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex: 1;
            min-width: 0;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-content {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }

        .task-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .priority-badge {
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.14rem 0.52rem;
            border-radius: 6px;
            font-size: 0.68rem;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .priority-medium {
            background: rgba(251, 191, 36, 0.16);
            color: #fde68a;
            border: 1px solid rgba(251, 191, 36, 0.35);
        }

        .priority-low {
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .task-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 0.4rem 0.7rem;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .action-btn:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: var(--accent);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.22);
            border-color: var(--danger);
            color: #fca5a5;
        }

        .empty-state {
            text-align: center;
            padding: 2.25rem 1rem;
            color: var(--text-secondary);
            font-size: 0.94rem;
        }

        @media (max-width: 640px) {
            .task-form {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <span class="eyebrow">JavaScript State Management &amp; DOM Engine</span>
            <h1>TaskFlow — Interactive To-Do Manager</h1>
            <p class="subtitle">Full CRUD operations, delegated event listeners, multi-state filtering, and automatic <code>window.localStorage</code> persistence.</p>
        </header>

        <section class="stats-bar" aria-label="Task Metrics">
            <div class="stat-box">
                <strong id="stat-total">0</strong>
                <span>Total Tasks</span>
            </div>
            <div class="stat-box">
                <strong id="stat-active">0</strong>
                <span>Active</span>
            </div>
            <div class="stat-box">
                <strong id="stat-completed">0</strong>
                <span>Completed</span>
            </div>
        </section>

        <section class="panel" aria-label="Create New Task">
            <form id="task-form" class="task-form">
                <input type="text" id="task-input" placeholder="What needs to be accomplished?" aria-label="Task description" required>
                <select id="priority-select" aria-label="Task priority">
                    <option value="high">High Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
                <button type="submit" class="btn-add">+ Add Task</button>
            </form>
        </section>

        <section class="panel" aria-label="Task List and Filters">
            <div class="controls-bar">
                <div class="filter-group" id="filter-controls" role="tablist" aria-label="Filter tasks">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="active">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button type="button" id="clear-completed-btn" class="btn-clear">Clear Completed</button>
            </div>

            <ul id="task-list" class="task-list" aria-live="polite"></ul>
        </section>
    </main>

    <script>
        const STORAGE_KEY = "thiranex_taskflow_state_v1";

        // Centralized Application State
        let state = {
            tasks: [],
            filter: "all"
        };

        // DOM References
        const taskForm = document.getElementById("task-form");
        const taskInput = document.getElementById("task-input");
        const prioritySelect = document.getElementById("priority-select");
        const taskListEl = document.getElementById("task-list");
        const filterControls = document.getElementById("filter-controls");
        const clearCompletedBtn = document.getElementById("clear-completed-btn");
        const statTotal = document.getElementById("stat-total");
        const statActive = document.getElementById("stat-active");
        const statCompleted = document.getElementById("stat-completed");

        // Load Initial State from window.localStorage
        function loadState() {
            const saved = window.localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    state = { tasks: [], filter: "all" };
                }
            } else {
                state.tasks = [
                    {
                        id: Date.now() - 2000,
                        title: "Implement full CRUD operations with JavaScript state",
                        priority: "high",
                        completed: true,
                        createdAt: new Date().toLocaleDateString()
                    },
                    {
                        id: Date.now() - 1000,
                        title: "Verify window.localStorage persistence across browser reloads",
                        priority: "medium",
                        completed: false,
                        createdAt: new Date().toLocaleDateString()
                    }
                ];
                saveState();
            }
        }

        // Save State Automatically to window.localStorage
        function saveState() {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // Dynamic DOM Element Creation & Rendering
        function render() {
            const total = state.tasks.length;
            const completedCount = state.tasks.filter(t => t.completed).length;
            const activeCount = total - completedCount;

            statTotal.textContent = total;
            statActive.textContent = activeCount;
            statCompleted.textContent = completedCount;

            // Update Filter Button Active States
            filterControls.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.filter === state.filter);
            });

            // Filter Tasks
            const visibleTasks = state.tasks.filter(task => {
                if (state.filter === "active") return !task.completed;
                if (state.filter === "completed") return task.completed;
                return true;
            });

            taskListEl.innerHTML = "";

            if (visibleTasks.length === 0) {
                const emptyLi = document.createElement("li");
                emptyLi.className = "empty-state";
                emptyLi.textContent = `No ${state.filter === "all" ? "" : state.filter + " "}tasks found. Add a task above to get started!`;
                taskListEl.appendChild(emptyLi);
                return;
            }

            visibleTasks.forEach(task => {
                const li = document.createElement("li");
                li.className = `task-item${task.completed ? " completed" : ""}`;
                li.dataset.id = task.id;

                const leftDiv = document.createElement("div");
                leftDiv.className = "task-left";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.dataset.action = "toggle";
                checkbox.setAttribute("aria-label", `Mark "${task.title}" as completed`);

                const contentDiv = document.createElement("div");
                contentDiv.className = "task-content";

                const titleSpan = document.createElement("span");
                titleSpan.className = "task-title";
                titleSpan.textContent = task.title;

                const metaDiv = document.createElement("div");
                metaDiv.className = "task-meta";

                const priorityBadge = document.createElement("span");
                priorityBadge.className = `priority-badge priority-${task.priority}`;
                priorityBadge.textContent = task.priority;

                const dateSpan = document.createElement("span");
                dateSpan.textContent = `Added ${task.createdAt}`;

                metaDiv.append(priorityBadge, dateSpan);
                contentDiv.append(titleSpan, metaDiv);
                leftDiv.append(checkbox, contentDiv);

                const actionsDiv = document.createElement("div");
                actionsDiv.className = "task-actions";

                const editBtn = document.createElement("button");
                editBtn.type = "button";
                editBtn.className = "action-btn";
                editBtn.dataset.action = "edit";
                editBtn.textContent = "Edit";

                const deleteBtn = document.createElement("button");
                deleteBtn.type = "button";
                deleteBtn.className = "action-btn delete";
                deleteBtn.dataset.action = "delete";
                deleteBtn.textContent = "Delete";

                actionsDiv.append(editBtn, deleteBtn);
                li.append(leftDiv, actionsDiv);
                taskListEl.appendChild(li);
            });
        }

        // CREATE: Add Task
        taskForm.addEventListener("submit", event => {
            event.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            state.tasks.unshift({
                id: Date.now(),
                title,
                priority: prioritySelect.value,
                completed: false,
                createdAt: new Date().toLocaleDateString()
            });

            taskInput.value = "";
            saveState();
            render();
        });

        // DELEGATED EVENT LISTENER: Toggle Complete, Edit (Update), Delete
        taskListEl.addEventListener("click", event => {
            const actionTarget = event.target.closest("[data-action]");
            if (!actionTarget) return;

            const taskItem = actionTarget.closest(".task-item");
            if (!taskItem) return;

            const taskId = Number(taskItem.dataset.id);
            const action = actionTarget.dataset.action;

            if (action === "toggle") {
                state.tasks = state.tasks.map(t =>
                    t.id === taskId ? { ...t, completed: !t.completed } : t
                );
            } else if (action === "edit") {
                const targetTask = state.tasks.find(t => t.id === taskId);
                if (!targetTask) return;
                const updatedTitle = prompt("Update task description:", targetTask.title);
                if (updatedTitle !== null && updatedTitle.trim() !== "") {
                    state.tasks = state.tasks.map(t =>
                        t.id === taskId ? { ...t, title: updatedTitle.trim() } : t
                    );
                }
            } else if (action === "delete") {
                state.tasks = state.tasks.filter(t => t.id !== taskId);
            }

            saveState();
            render();
        });

        // DELEGATED FILTER LISTENER: All / Active / Completed
        filterControls.addEventListener("click", event => {
            const filterBtn = event.target.closest("[data-filter]");
            if (!filterBtn) return;

            state.filter = filterBtn.dataset.filter;
            saveState();
            render();
        });

        // Clear Completed Tasks
        clearCompletedBtn.addEventListener("click", () => {
            state.tasks = state.tasks.filter(t => !t.completed);
            saveState();
            render();
        });

        // Initialize App
        loadState();
        render();
    </script>
</body>
</html>
